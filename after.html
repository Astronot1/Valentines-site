            border:3px solid #ff4f8d;
            border-radius:18px;
            padding:8px;
            background:white;
            transition:transform .15s ease, box-shadow .15s ease;
          ">
                        <img src="https://via.placeholder.com/500x320" alt=""
                            style="width:100%;height:180px;object-fit:cover;border-radius:12px;display:block;" />
                    </div>
                </button>

            </div>

            <!-- CONTINUE BUTTON -->
            <div style="display:flex; justify-content:center; margin-top:30px;">
                <button class="btn btn-primary" id="continueBtn" disabled style="opacity:.5; filter:grayscale(25%);">
                    continue
                </button>
            </div>

        </div>
    </main>

    <script>
        const continueBtn = document.getElementById("continueBtn");
        const cards = document.querySelectorAll(".after-card");

        function setContinueEnabled(enabled) {
            continueBtn.disabled = !enabled;
            continueBtn.style.opacity = enabled ? "1" : ".5";
            continueBtn.style.filter = enabled ? "none" : "grayscale(25%)";
        }
        setContinueEnabled(false);

        function clearSelection() {
            cards.forEach(c => {
                c.style.position = "relative";
                c.style.zIndex = "1";
                const box = c.querySelector(".img-box");
                box.style.transform = "scale(1)";
                box.style.boxShadow = "none";
                box.style.borderColor = "#ff4f8d";
            });
        }

        cards.forEach(card => {
            card.addEventListener("click", () => {
                clearSelection();

                // pop on top
                card.style.position = "relative";
                card.style.zIndex = "999";

                const box = card.querySelector(".img-box");
                box.style.transform = "scale(1.06)";
                box.style.boxShadow = "0 26px 70px rgba(255,79,141,0.35)";
                box.style.borderColor = "#ff2f78";

                // save for confirm page
                localStorage.setItem("afterName", card.dataset.name);
                localStorage.setItem("afterImg", card.dataset.img);

                setContinueEnabled(true);
            });
        });

        continueBtn.addEventListener("click", () => {
            if (continueBtn.disabled) return;
            window.location.href = "confirm.html";
        });

        // Mobile: 1 column when narrow
        function responsiveGrid() {
            const grid = document.getElementById("afterGrid");
            if (window.innerWidth < 740) {
                grid.style.gridTemplateColumns = "320px";
            } else {
                grid.style.gridTemplateColumns = "repeat(2, 320px)";
            }
        }
        window.addEventListener("resize", responsiveGrid);
        responsiveGrid();
    </script>

</body>

</html>
