    <!-- Replace ONLY your <script> block with this one (everything else can stay the same) -->
    <script>
        const continueBtn = document.getElementById("continueBtn");
        const cards = document.querySelectorAll(".restaurant-card");

        function setContinueEnabled(enabled) {
            continueBtn.disabled = !enabled;
            continueBtn.style.opacity = enabled ? "1" : ".5";
            continueBtn.style.filter = enabled ? "none" : "grayscale(25%)";
        }
        setContinueEnabled(false);

        function clearSelection() {
            cards.forEach(c => {
                // bring back to normal stacking
                c.style.position = "relative";
                c.style.zIndex = "1";

                const box = c.querySelector(".img-box");
                box.style.transform = "scale(1)";
                box.style.boxShadow = "none";
                box.style.borderColor = "#ff4f8d";
            });
        }

        cards.forEach(card => {
            card.addEventListener("click", () => {
                clearSelection();

                // Make the selected one sit ON TOP of the others
                card.style.position = "relative";
                card.style.zIndex = "999";

                const box = card.querySelector(".img-box");

                // Make it more prominent but controlled so it doesn't feel messy
                box.style.transform = "scale(1.06)";
                box.style.boxShadow = "0 26px 70px rgba(255,79,141,0.35)";
                box.style.borderColor = "#ff2f78";

                // Save selection for the next / final page
                localStorage.setItem("restaurantName", card.dataset.name);
                localStorage.setItem("restaurantImg", card.dataset.img);

                setContinueEnabled(true);
            });
        });

        continueBtn.addEventListener("click", () => {
            if (continueBtn.disabled) return;
            window.location.href = "datetime.html";
        });

        // Mobile: stack into 1 column when narrow
        function responsiveGrid() {
            const grid = document.getElementById("restaurantGrid");
            if (window.innerWidth < 740) {
                grid.style.gridTemplateColumns = "320px";
            } else {
                grid.style.gridTemplateColumns = "repeat(2, 320px)";
            }
        }
        window.addEventListener("resize", responsiveGrid);
        responsiveGrid();
    </script>


</body>

</html>
